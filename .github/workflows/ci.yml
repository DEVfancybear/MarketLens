name: CI

on:
  push:
  pull_request:

jobs:
  replay-client-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:replay-client-boundary
      - run: npm run test:replay
      - run: npm run test:trade
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go vet ./...

  execution-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/execution
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/execution -> target
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --all-targets

  # Publishes the deployable Windows backend so the production host never needs a
  # Go or Rust toolchain. Deployment stays manual: see tools/deploy-backend.ps1.
  backend-artifact:
    needs: [backend, execution-rust]
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/execution -> target

      # SQL migrations are embedded in migrate.exe via migrations.FS, so the
      # artifact ships binaries only.
      - name: Build Go binaries
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/bin | Out-Null
          foreach ($cmd in @('api', 'migrate', 'mt5-stream')) {
            go build -trimpath -o "stage/bin/$cmd.exe" "./cmd/$cmd"
            if ($LASTEXITCODE -ne 0) { throw "go build ./cmd/$cmd failed" }
          }

      - name: Build Rust execution gateway
        working-directory: backend/execution
        run: cargo build --release --locked -p execution-gateway

      - name: Package artifact
        working-directory: backend
        shell: pwsh
        run: |
          Copy-Item execution/target/release/execution-gateway.exe stage/bin/ -Force
          $manifest = [ordered]@{
            commit        = $env:GITHUB_SHA
            ref           = $env:GITHUB_REF
            runId         = $env:GITHUB_RUN_ID
            runNumber     = $env:GITHUB_RUN_NUMBER
            builtAtUtc    = (Get-Date).ToUniversalTime().ToString('o')
            goVersion     = (go version)
            cargoVersion  = (cargo --version)
            runnerOs      = $env:RUNNER_OS
            binaries      = @('api.exe', 'migrate.exe', 'mt5-stream.exe', 'execution-gateway.exe')
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content stage/MANIFEST.json -Encoding utf8
          # sha256sum-compatible lines with stage-relative, forward-slash paths.
          # Same derivation as tools/verify-backend-deploy.ps1 so local packaging
          # and CI produce byte-identical SHA256SUMS.
          Push-Location stage
          $stageRoot = (Get-Location).Path
          $lines = Get-ChildItem -Recurse -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | ForEach-Object {
            $rel = $_.FullName.Substring($stageRoot.Length).TrimStart('\').Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $rel"
          }
          $lines | Set-Content SHA256SUMS -Encoding ascii
          Pop-Location
          Get-Content stage/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: marketlens-backend-windows-amd64
          path: backend/stage/
          retention-days: 30
          if-no-files-found: error

      # Tags additionally get a durable Release so an operator can deploy an exact
      # version long after the 30-day artifact retention window.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        working-directory: backend
        run: |
          Compress-Archive -Path stage/* -DestinationPath marketlens-backend-windows-amd64.zip -Force
          gh release upload "$env:GITHUB_REF_NAME" marketlens-backend-windows-amd64.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
